<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanCake - 智能旅行工作台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #6c5ce7; --primary-light: #a29bfe;
      --secondary: #fdcb6e; --secondary-light: #fff3d4;
      --bg: #f4f6fb; --card: #ffffff; --text: #2d3436; --muted: #636e72;
      --danger: #d63031; --success: #00b894;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    .app-layout { display: flex; height: 100vh; }
    
    /* 左侧控制台 */
    .sidebar { width: 340px; background: var(--card); padding: 30px 25px; display: flex; flex-direction: column; border-right: 1px solid #eee; z-index: 10; overflow-y: auto; }
    .logo { font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 25px; }
    .sidebar-form { background: var(--bg); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #ebeef5; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
    .form-group input:focus { border-color: var(--primary); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
    .tag { padding: 6px 12px; border-radius: 20px; background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #dcdde1; }
    .tag.active { background: var(--secondary-light); color: var(--danger); border-color: var(--secondary); }
    .btn-generate { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3); }
    
    /* 天气卡片 */
    .weather-card { background: linear-gradient(135deg, #e0c3fc, #8ec5fc); border-radius: 20px; padding: 16px 20px; margin-bottom: 20px; display: none; }
    .weather-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .weather-mid { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .weather-mid .temp { font-size: 36px; font-weight: 800; }
    .weather-bottom { display: flex; gap: 15px; font-size: 12px; font-weight: 600; opacity: 0.8; }

    /* 导航菜单 */
    .nav-menu { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .nav-item { padding: 15px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; color: var(--muted); display: flex; gap: 12px; }
    .nav-item.active { background: var(--secondary-light); color: var(--text); }

    /* 右侧主内容区 */
    .main-content { flex: 1; padding: 30px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .top-row { display: flex; gap: 20px; height: 200px; }
    .banner-card { flex: 2; background: linear-gradient(135deg, var(--primary-light), #dfe6e9); border-radius: 24px; padding: 30px; position: relative; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .banner-card h1 { font-size: 40px; font-weight: 800; }
    .banner-emoji { position: absolute; right: 20px; bottom: -20px; font-size: 160px; opacity: 0.8; }
    .expense-card { flex: 1; background: var(--card); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .donut-chart { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
    .donut-inner { width: 80px; height: 80px; background: var(--card); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .info-box { background: var(--card); border-radius: 20px; padding: 20px; display: flex; gap: 15px; }
    .info-icon { width: 45px; height: 45px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .info-text span { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .info-text strong { font-size: 16px; }
    .bottom-row { display: flex; gap: 20px; flex: 1; min-height: 350px; }
    .map-widget { flex: 1; background: var(--card); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; }
    #map-container { flex: 1; border-radius: 16px; z-index: 1; }
    .timeline-widget { flex: 1; background: var(--card); border-radius: 24px; padding: 25px; display: flex; flex-direction: column; }
    .timeline-list { flex: 1; overflow-y: auto; padding-left: 10px; border-left: 2px dashed #e1e4e8; }
    .timeline-item { position: relative; padding-left: 25px; margin-bottom: 20px; }
    .timeline-item::before { content: ''; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--secondary); }
    .timeline-item .day { font-size: 14px; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
    .timeline-item .desc { font-size: 14px; color: var(--text); background: var(--bg); padding: 12px; border-radius: 12px; }

    /* ⭐️ 旅行日记专属样式 ⭐️ */
    .diary-container { display: flex; gap: 20px; height: 100%; }
    .diary-form { width: 320px; background: var(--card); padding: 25px; border-radius: 24px; height: fit-content; }
    .diary-form textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #dcdde1; border-radius: 10px; resize: none; margin-bottom: 15px; font-size: 14px; outline: none; }
    .diary-form input[type="file"] { margin-bottom: 15px; font-size: 13px; }
    .diary-list-wrapper { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 10px; }
    .diary-card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; gap: 20px; }
    .diary-card img { width: 150px; height: 150px; object-fit: cover; border-radius: 12px; }
    .diary-card-info { flex: 1; display: flex; flex-direction: column; }
    .diary-card-info .date { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .diary-card-info .text { font-size: 15px; line-height: 1.6; flex: 1; }
    .diary-card-info .del-btn { color: var(--danger); font-size: 12px; cursor: pointer; text-align: right; margin-top: 10px; }

    .view-panel { display: none; }
    .view-panel.active { display: block; }
    #view-diary.view-panel.active { display: flex; flex-direction: column; height: 100%; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">PlanCake 🍰</div>
      <div class="sidebar-form">
        <div class="form-group">
          <label>📍 目的地</label>
          <input type="text" id="input-dest" value="成都" onchange="fetchWeatherForCity(this.value)">
        </div>
        <div class="form-group" style="display:flex; gap:8px;">
          <div style="flex:1;"><label>📅 出发</label><input type="date" id="input-start"></div>
          <div style="flex:1;"><label>📅 返回</label><input type="date" id="input-end"></div>
        </div>
        <div class="form-group" style="display:flex; gap:8px;">
          <div style="flex:1;"><label>👥 人数</label><input type="number" id="input-people" value="2"></div>
          <div style="flex:1;"><label>💰 预算(¥)</label><input type="number" id="input-budget" value="5000"></div>
        </div>
        <div class="form-group">
          <label>✨ 偏好</label>
          <div class="tags" id="input-prefs">
            <div class="tag active" onclick="this.classList.toggle('active')">美食优先</div>
            <div class="tag active" onclick="this.classList.toggle('active')">自然风光</div>
            <div class="tag" onclick="this.classList.toggle('active')">人文历史</div>
          </div>
        </div>
        <button class="btn-generate" onclick="generatePlan()">✨ 开始烘焙行程</button>
      </div>
      <div class="weather-card" id="weather-widget">
        <div class="weather-top"><span id="weather-city">成都</span><span id="weather-icon">⛅</span></div>
        <div class="weather-mid"><div class="temp" id="weather-temp">--°C</div><div id="weather-desc">获取中...</div></div>
        <div class="weather-bottom"><span>💨 风速 <span id="weather-wind">--</span></span><span>💧 湿度 <span id="weather-humidity">--</span>%</span></div>
      </div>
      <div class="nav-menu">
        <div class="nav-item active" onclick="switchNav('dashboard', this)"><span>🏠</span> 行程概览</div>
        <!-- ⭐️ 新增旅行日记菜单 ⭐️ -->
        <div class="nav-item" onclick="switchNav('diary', this)"><span>📔</span> 旅行日记</div>
        <div class="nav-item" onclick="switchNav('budget', this)"><span>💰</span> 预算记账本</div>
        <div class="nav-item" onclick="switchNav('discover', this)"><span>🌍</span> 灵感发现</div>
      </div>
    </aside>

    <main class="main-content">
      <!-- 视图：概览 -->
      <div id="view-dashboard" class="view-panel active">
        <div class="top-row">
          <div class="banner-card">
            <div><div id="dash-date">准备出发</div><h1 id="dash-dest">去哪里玩？</h1></div>
            <div class="banner-emoji" id="dash-emoji">🏝️</div>
          </div>
          <div class="expense-card">
            <h3>预算消耗</h3>
            <div class="donut-chart" id="donut-chart"><div class="donut-inner"><span>已用</span><strong id="dash-budget-percent">0%</strong></div></div>
            <div style="font-size: 13px;">已花 <span id="dash-spent">¥0</span> / 总预算 <span id="dash-total-budget">¥5000</span></div>
          </div>
        </div>
        <div class="info-row">
          <div class="info-box"><div class="info-icon">📅</div><div class="info-text"><span>出行天数</span><strong id="info-days">--</strong></div></div>
          <div class="info-box"><div class="info-icon">👥</div><div class="info-text"><span>同行人数</span><strong id="info-people">--</strong></div></div>
          <div class="info-box"><div class="info-icon">✨</div><div class="info-text"><span>偏好节奏</span><strong id="info-prefs">待定</strong></div></div>
        </div>
        <div class="bottom-row">
          <div class="map-widget"><h3>📍 专属路线地图</h3><div id="map-container"></div></div>
          <div class="timeline-widget"><h3>🗓️ 每日行程时间线</h3><div class="timeline-list" id="timeline-list"><div style="text-align:center; margin-top:50px; color:var(--muted);">填写左侧，点击生成 🍰</div></div></div>
        </div>
      </div>

      <!-- ⭐️ 视图：旅行日记 ⭐️ -->
      <div id="view-diary" class="view-panel">
        <h2 style="margin-bottom:20px; color:var(--primary);">📔 我的旅行日记</h2>
        <div class="diary-container">
          <!-- 左侧写日记表单 -->
          <div class="diary-form">
            <h3 style="margin-bottom:15px; font-size:16px;">写下此刻的记忆</h3>
            <textarea id="diary-text" placeholder="今天发生了什么有趣的事？风景有多美？"></textarea>
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:8px;">上传照片</label>
            <input type="file" id="diary-photo" accept="image/*" onchange="previewPhoto(this)">
            <img id="photo-preview" style="display:none; width:100%; border-radius:10px; margin-bottom:15px;">
            <button class="btn-generate" style="margin-top:0; padding:12px; font-size:16px;" onclick="saveDiary()">保存日记</button>
            <p style="font-size:11px; color:var(--muted); margin-top:10px; text-align:center;">* 日记保存在本地浏览器中，不会上传到云端</p>
          </div>
          <!-- 右侧日记列表 -->
          <div class="diary-list-wrapper" id="diary-list">
            <!-- 动态生成日记卡片 -->
          </div>
        </div>
      </div>

      <!-- 视图：记账本 -->
      <div id="view-budget" class="view-panel">
        <h2 style="margin-bottom:20px; color:var(--primary);">💰 预算记账本</h2>
        <div style="background: #fff; padding: 30px; border-radius: 24px;">
          <div style="display: flex; gap: 10px;">
             <input type="text" id="exp-desc" placeholder="花费说明" style="padding:12px; border-radius:10px; border:1px solid #ddd; flex:1;">
             <input type="number" id="exp-amount" placeholder="金额(¥)" style="padding:12px; border-radius:10px; border:1px solid #ddd; width:120px;">
             <button class="btn-generate" style="margin:0; padding:10px 20px; font-size:15px;" onclick="addExpense()">记一笔</button>
          </div>
          <div id="expense-list" style="margin-top: 20px;"></div>
        </div>
      </div>
      
      <!-- 视图：灵感 -->
      <div id="view-discover" class="view-panel">
        <h2 style="margin-bottom:20px; color:var(--primary);">🌍 灵感发现</h2>
        <div style="background: #fff; padding: 30px; border-radius: 24px;"><p>更多全球精选旅行灵感正在准备中...</p></div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const today = new Date(); const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 3);
    document.getElementById('input-start').value = today.toISOString().split('T')[0];
    document.getElementById('input-end').value = nextWeek.toISOString().split('T')[0];

    // ⭐️ 读取本地保存的日记和记账数据
    let appState = { 
      expenses: JSON.parse(localStorage.getItem('pc_expenses')) || [], 
      diaries: JSON.parse(localStorage.getItem('pc_diaries')) || [],
      totalBudget: 5000 
    };
    let mapInstance = null;
    let tempPhotoBase64 = null; // 临时存照片

    // ⭐️ 天气逻辑
    function getWeatherInfo(code) {
      const map = {0:{icon:'☀️',desc:'晴朗'},1:{icon:'🌤️',desc:'大部晴朗'},2:{icon:'⛅',desc:'多云'},3:{icon:'☁️',desc:'阴天'},45:{icon:'🌫️',desc:'有雾'},51:{icon:'🌦️',desc:'小雨'},61:{icon:'🌧️',desc:'中雨'},71:{icon:'🌨️',desc:'小雪'},95:{icon:'⛈️',desc:'雷暴'}};
      return map[code] || {icon:'🌡️',desc:'未知'};
    }
    async function fetchWeatherForCity(cityName) {
      if (!cityName) return;
      const widget = document.getElementById('weather-widget'); widget.style.display = 'block';
      document.getElementById('weather-city').textContent = cityName; document.getElementById('weather-desc').textContent = '获取中...';
      try {
        const geoRes = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(cityName)}&limit=1`);
        const geoData = await geoRes.json();
        if (!geoData.features || geoData.features.length === 0) return;
        const lat = geoData.features[0].geometry.coordinates[1]; const lon = geoData.features[0].geometry.coordinates[0];
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`);
        const weatherData = await weatherRes.json(); const current = weatherData.current; const wInfo = getWeatherInfo(current.weather_code);
        document.getElementById('weather-icon').textContent = wInfo.icon; document.getElementById('weather-temp').textContent = `${Math.round(current.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent = wInfo.desc; document.getElementById('weather-wind').textContent = current.wind_speed_10m; document.getElementById('weather-humidity').textContent = current.relative_humidity_2m;
      } catch (err) { console.error(err); }
    }

    // 导航切换
    function switchNav(viewId, el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active'); document.getElementById(`view-${viewId}`).classList.add('active');
      if (viewId === 'dashboard' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 100);
    }

    // ⭐️ 记账本逻辑 (带本地存储)
    function updateBudgetUI() {
      let spent = appState.expenses.reduce((sum, item) => sum + item.amount, 0);
      let percent = Math.min(100, Math.round((spent / appState.totalBudget) * 100)) || 0;
      document.getElementById('dash-spent').textContent = `¥${spent}`;
      document.getElementById('dash-total-budget').textContent = `¥${appState.totalBudget}`;
      document.getElementById('dash-budget-percent').textContent = `${percent}%`;
      document.getElementById('donut-chart').style.background = `conic-gradient(var(--primary) ${percent}%, var(--secondary) ${percent}% 100%)`;
      
      const list = document.getElementById('expense-list');
      if(list) {
        list.innerHTML = appState.expenses.slice().reverse().map(exp => `
          <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #eee;">
            <div>${exp.desc}</div><div><span style="font-weight:bold; margin-right:15px;">¥${exp.amount}</span>
            <span style="color: var(--danger); cursor: pointer; font-size:12px;" onclick="deleteExpense(${exp.id})">删除</span></div>
          </div>
        `).join('');
      }
      localStorage.setItem('pc_expenses', JSON.stringify(appState.expenses));
    }
    function addExpense() {
      const desc = document.getElementById('exp-desc').value; const amount = parseFloat(document.getElementById('exp-amount').value);
      if (!desc || !amount) return alert("请填写说明和金额");
      appState.expenses.push({ id: Date.now(), desc, amount });
      document.getElementById('exp-desc').value = ''; document.getElementById('exp-amount').value = ''; updateBudgetUI();
    }
    function deleteExpense(id) { appState.expenses = appState.expenses.filter(e => e.id !== id); updateBudgetUI(); }

    // ⭐️ 旅行日记逻辑 (带图片读取和本地存储)
    function previewPhoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempPhotoBase64 = e.target.result;
          const img = document.getElementById('photo-preview');
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
    function saveDiary() {
      const text = document.getElementById('diary-text').value;
      if (!text && !tempPhotoBase64) return alert("写点什么或者传张照片吧！");

      appState.diaries.push({
        id: Date.now(),
        date: new Date().toLocaleString(),
        text: text,
        photo: tempPhotoBase64
      });

      // 清空表单
      document.getElementById('diary-text').value = '';
      document.getElementById('diary-photo').value = '';
      document.getElementById('photo-preview').style.display = 'none';
      tempPhotoBase64 = null;

      renderDiaries();
    }
    function renderDiaries() {
      localStorage.setItem('pc_diaries', JSON.stringify(appState.diaries));
      const list = document.getElementById('diary-list');
      list.innerHTML = appState.diaries.length === 0 ? '<div style="color:var(--muted); text-align:center; margin-top:50px;">还没有日记，快记录下美好的瞬间吧 📸</div>' : '';

      appState.diaries.slice().reverse().forEach(d => {
        const card = document.createElement('div');
        card.className = 'diary-card';
        card.innerHTML = `
          ${d.photo ? `<img src="${d.photo}">` : ''}
          <div class="diary-card-info">
            <div class="date">📅 ${d.date}</div>
            <div class="text">${d.text.replace(/\n/g, '<br>')}</div>
            <div class="del-btn" onclick="deleteDiary(${d.id})">删除</div>
          </div>
        `;
        list.appendChild(card);
      });
    }
    function deleteDiary(id) {
      if(confirm('确定要删除这条日记吗？')) {
        appState.diaries = appState.diaries.filter(d => d.id !== id);
        renderDiaries();
      }
    }

    // 生成行程 (AI + 兜底)
    async function generatePlan() {
      const dest = document.getElementById('input-dest').value;
      const start = document.getElementById('input-start').value;
      const end = document.getElementById('input-end').value;
      const people = document.getElementById('input-people').value;
      const budget = parseFloat(document.getElementById('input-budget').value) || 5000;
      const days = Math.max(1, Math.round((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)) + 1);
      if(!dest) return alert('请填写目的地');

      fetchWeatherForCity(dest);
      appState.totalBudget = budget; updateBudgetUI();
      document.getElementById('dash-dest').textContent = dest;
      document.getElementById('dash-date').textContent = `${start} 出发 · ${days}天`;
      document.getElementById('info-days').textContent = `${days} 天`;
      document.getElementById('info-people').textContent = `${people} 人`;

      const timeline = document.getElementById('timeline-list');
      timeline.innerHTML = `<div style="text-align:center; margin-top:50px; color:var(--primary);"><div style="font-size:40px; animation:bounce 1s infinite alternate; margin-bottom:10px;">🎂</div>AI 正在烘焙...</div>`;

      initMap(dest);

      try {
        const response = await fetch('/api/parse', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: `目的地:${dest}, 天数:${days}天` })
        });
        const data = await response.json();
        if (data.ok && data.seed && data.seed.dailyPlan) { renderTimeline(data.seed.dailyPlan); }
        else { renderMockTimeline(dest, days); }
      } catch (e) { renderMockTimeline(dest, days); }
    }
    function renderTimeline(dailyPlan) {
      const timeline = document.getElementById('timeline-list'); timeline.innerHTML = '';
      dailyPlan.forEach((text, i) => {
        timeline.innerHTML += `<div class="timeline-item"><div class="day">Day ${i + 1}</div><div class="desc">${text}</div></div>`;
      });
    }
    function renderMockTimeline(dest, days) {
      const mock = Array.from({length: days}).map(() => `上午前往${dest}最著名的地标打卡；下午逛逛特色街区，品尝地道小吃；晚上享用当地特色晚餐并休息。`);
      renderTimeline(mock);
    }
    async function initMap(dest) {
      if (mapInstance) mapInstance.remove();
      mapInstance = L.map('map-container').setView([20, 0], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(mapInstance);
      try {
        const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(dest)}&limit=1`);
        const data = await res.json();
        if (data.features?.length > 0) {
          const lat = data.features[0].geometry.coordinates[1]; const lng = data.features[0].geometry.coordinates[0];
          mapInstance.flyTo([lat, lng], 12, { duration: 2 });
          L.marker([lat + 0.01, lng + 0.01]).addTo(mapInstance).bindPopup(`${dest} 地标`);
          L.marker([lat - 0.01, lng + 0.01]).addTo(mapInstance).bindPopup(`特色餐厅 🍴`);
        }
      } catch (err) {}
    }

    // 页面加载时初始化数据
    updateBudgetUI();
    renderDiaries();
    fetchWeatherForCity(document.getElementById('input-dest').value);
  </script>
</body>
</html>
