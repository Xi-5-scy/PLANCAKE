<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PlanCake - AI 旅行规划助手</title>
  <style>
    :root {
      --primary-purple: #6c5ce7;
      --primary-light: #a29bfe;
      --secondary-yellow: #fdcb6e;
      --secondary-light: #fff3d4;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --bg-color: #f7f8fc;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }

    /* 模拟手机 App 的外壳 */
    .app-shell {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px; /* 限制最大宽度，看起来像手机 */
      min-height: 100vh;
      box-shadow: 0 0 40px rgba(108, 92, 231, 0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部导航栏 */
    .top-nav {
      background: linear-gradient(135deg, var(--primary-purple), var(--primary-light));
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
    }
    .top-nav .back-btn { cursor: pointer; display: none; font-size: 24px; line-height: 1; }

    /* 视图容器 */
    .view-container { flex: 1; overflow-y: auto; padding: 20px; display: none; padding-bottom: 80px; }
    .view-container.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ---- 首页样式 ---- */
    .hero { text-align: center; margin: 30px 0; }
    .hero-logo { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, var(--primary-purple), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-sub { color: var(--text-muted); margin-top: 8px; }

    .tags-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .tag { background-color: var(--secondary-light); color: #d63031; font-size: 13px; padding: 8px 14px; border-radius: 20px; cursor: pointer; border: 1px solid var(--secondary-yellow); transition: all 0.2s; }
    .tag:active { background-color: var(--secondary-yellow); color: #fff; }

    .input-box { background: var(--bg-color); border-radius: 16px; padding: 20px; border: 1px solid #e1e4e8; }
    textarea {
      width: 100%; height: 100px; padding: 15px; border: 1px solid #e1e4e8; border-radius: 12px;
      font-size: 16px; resize: none; outline: none; background: #fff; transition: border-color 0.3s;
    }
    textarea:focus { border-color: var(--primary-purple); }
    
    .btn-primary {
      width: 100%; background: linear-gradient(135deg, var(--primary-purple), var(--primary-light));
      color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold;
      border-radius: 12px; margin-top: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    }
    .btn-primary:active { transform: scale(0.98); }

    /* ---- 加载页样式 ---- */
    .loading-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; }
    .cake-spinner {
      font-size: 50px; animation: bounce 1s infinite alternate;
    }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    .loading-text { margin-top: 20px; color: var(--primary-purple); font-weight: bold; font-size: 18px; }

    /* ---- 结果页样式 ---- */
    .result-header { background: var(--secondary-light); padding: 15px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid var(--secondary-yellow); }
    .day-card { border: 1px solid #e1e4e8; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; background: #fff; }
    .day-title { font-size: 16px; font-weight: bold; color: var(--primary-purple); margin-bottom: 10px; display: flex; align-items: center; }
    .day-title::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--primary-purple); border-radius: 50%; margin-right: 8px; }
    .day-content { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    
    /* 原始数据折叠 */
    details { margin-top: 20px; background: #fafafa; border-radius: 8px; padding: 10px; }
    summary { cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: bold; }
    pre { margin-top: 10px; background: #2d3436; color: #a29bfe; padding: 15px; border-radius: 8px; font-size: 12px; overflow-x: auto; }

    /* ---- 底部 Tab 栏 ---- */
    .bottom-tabs {
      position: absolute; bottom: 0; width: 100%; height: 65px; background: #fff;
      border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; cursor: pointer; }
    .tab-item.active { color: var(--primary-purple); font-weight: bold; }
    .tab-icon { font-size: 22px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- 顶部导航 -->
    <div class="top-nav">
      <span class="back-btn" onclick="switchView('view-home')">←</span>
      <span id="nav-title">PlanCake</span>
      <span style="width: 24px;"></span> <!-- 占位保持居中 -->
    </div>

    <!-- 视图 1：首页 -->
    <div id="view-home" class="view-container active">
      <div class="hero">
        <div class="hero-logo">PlanCake 🍰</div>
        <div class="hero-sub">你的 AI 分层旅行规划师</div>
      </div>

      <div class="tags-container">
        <div class="tag" onclick="fillInput('带爸妈去关西玩5天，不想太赶，预算一万')">带爸妈关西5日游</div>
        <div class="tag" onclick="fillInput('周末去成都吃美食，2天，预算2000')">成都周末美食</div>
        <div class="tag" onclick="fillInput('情侣去日本看樱花，5天，节奏慢一点')">日本赏樱慢游</div>
      </div>

      <div class="input-box">
        <textarea id="user-input" placeholder="想去哪玩？有什么特殊要求？告诉我，我来帮你规划..."></textarea>
        <button class="btn-primary" onclick="generatePlan()">开始规划</button>
      </div>
    </div>

    <!-- 视图 2：加载中 -->
    <div id="view-loading" class="view-container">
      <div class="loading-wrapper">
        <div class="cake-spinner">🎂</div>
        <div class="loading-text">AI 正在为你烘焙行程...</div>
      </div>
    </div>

    <!-- 视图 3：结果页 -->
    <div id="view-result" class="view-container">
      <div class="result-header">
        <strong>规划完成！</strong><br>
        <span style="font-size: 14px; color: var(--text-muted);" id="result-summary">正在读取目的地...</span>
      </div>

      <div id="itinerary-list">
        <!-- 动态生成的卡片会放在这里 -->
      </div>

      <details>
        <summary>🔍 查看原始 JSON 数据</summary>
        <pre id="raw-json">等待数据...</pre>
      </details>

      <button class="btn-primary" style="margin-top: 30px;" onclick="switchView('view-home')">再规划一个</button>
    </div>

    <!-- 视图 4：我的 -->
    <div id="view-profile" class="view-container">
      <div class="hero">
        <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
        <div style="font-weight: bold; font-size: 20px;">未登录用户</div>
        <div style="color: var(--text-muted); margin-top: 5px;">登录后可保存你的专属行程</div>
      </div>
      <button class="btn-primary" onclick="alert('注册功能正在开发中，敬请期待！')">立即登录 / 注册</button>
    </div>

    <!-- 底部 Tab -->
    <div class="bottom-tabs">
      <div class="tab-item active" id="tab-home" onclick="switchView('view-home', 'tab-home')">
        <div class="tab-icon">🏠</div>首页
      </div>
      <div class="tab-item" id="tab-profile" onclick="switchView('view-profile', 'tab-profile')">
        <div class="tab-icon">👤</div>我的
      </div>
    </div>
  </div>

  <script>
    // 页面切换逻辑
    function switchView(viewId, tabId = 'tab-home') {
      // 隐藏所有视图
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      // 显示目标视图
      document.getElementById(viewId).classList.add('active');

      // 底部 Tab 高亮逻辑
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      if(document.getElementById(tabId)) document.getElementById(tabId).classList.add('active');

      // 顶部导航栏逻辑
      const backBtn = document.querySelector('.back-btn');
      const navTitle = document.getElementById('nav-title');
      if (viewId === 'view-home') {
        backBtn.style.display = 'none';
        navTitle.textContent = 'PlanCake';
      } else if (viewId === 'view-result') {
        backBtn.style.display = 'block';
        navTitle.textContent = '规划详情';
      } else if (viewId === 'view-loading') {
        backBtn.style.display = 'none';
        navTitle.textContent = '生成中';
      } else {
        backBtn.style.display = 'none';
        navTitle.textContent = '我的';
      }
    }

    function fillInput(text) {
      document.getElementById('user-input').value = text;
    }

    async function generatePlan() {
      const text = document.getElementById('user-input').value;
      if (!text) return alert('请先告诉我想去哪里玩哦~');

      // 1. 切换到加载页
      switchView('view-loading');

      try {
        // 2. 发起请求
        const response = await fetch('/api/parse', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        const data = await response.json();
        
        // 3. 渲染数据并切换到结果页
        renderResult(data, text);

      } catch (error) {
        alert('出错啦：' + error.message);
        switchView('view-home');
      }
    }

    function renderResult(data, userInput) {
      // 显示原始 JSON
      document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);

      const listEl = document.getElementById('itinerary-list');
      const summaryEl = document.getElementById('result-summary');
      listEl.innerHTML = ''; // 清空上一次的结果

      if (!data.ok) {
        summaryEl.textContent = "解析失败，请重试";
        listEl.innerHTML = `<div style="color:red; font-size:14px;">AI 大脑开小差了，请返回重试。</div>`;
        switchView('view-result');
        return;
      }

      // 如果成功返回了 seed (意图解析)
      const seed = data.seed || {};
      summaryEl.textContent = `为你规划了 ${seed.days || 3} 天的 ${seed.destination || '神秘'} 之旅`;

      // 因为目前后端只做了“意图解析”，没有真正生成每天的行程。
      // 为了展示前端页面的效果，这里我们根据天数“模拟”生成漂亮的卡片。
      const days = seed.days || 3;
      for (let i = 1; i <= days; i++) {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
          <div class="day-title">第 ${i} 天</div>
          <div class="day-content">
            <div>📍 上午：抵达目的地，办理入住，稍作休息。</div>
            <div>📍 下午：根据你的偏好（${(seed.interests || ['游玩']).join('、')}），安排核心景点打卡。</div>
            <div>📍 晚上：品尝当地特色美食，回酒店休息。</div>
            <div style="margin-top: 8px; font-size: 12px; color: #b2bec3;">
              (这是演示版卡片，下一步我们会让 AI 生成真实行程)
            </div>
          </div>
        `;
        listEl.appendChild(card);
      }

      // 切换到结果页
      switchView('view-result');
    }
  </script>
</body>
</html>
