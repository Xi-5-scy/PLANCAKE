<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanCake-AI 1.1 - 智能旅行工作台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap');

    :root {
      --bg-color: #E8F2F7;
      --primary: #9AB6C9;
      --primary-light: #C2D6E1;
      --btn-shadow: #7692A5;
      --secondary: #E8B4A2; --secondary-light: #FDF2EE;
      --text: #5A5A5A; --muted: #999999;
      --danger: #E5989B;
      --shadow-cute: 0 8px 24px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Quicksand', -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.5'%3E%3Cpath d='M30 10 L32 16 L38 18 L32 20 L30 26 L28 20 L22 18 L28 16 Z'/%3E%3Ccircle cx='10' cy='40' r='3'/%3E%3Ccircle cx='50' cy='20' r='3'/%3E%3Cpath d='M15 15 L17 19 L21 21 L17 23 L15 27 L13 23 L9 21 L13 19 Z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      transition: background-color 0.6s ease;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

    .top-navbar { height: 72px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.02); z-index: 100; flex-shrink: 0; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
    .logo { font-size: 24px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; transition: color 0.6s; cursor: pointer; }
    .logo span { font-size: 26px; animation: float 3s ease-in-out infinite; }

    .top-tabs { display: flex; gap: 10px; }
    .top-tab { padding: 10px 22px; border-radius: 16px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; user-select: none; }
    .top-tab:hover { background: var(--bg-color); color: var(--primary); }
    .top-tab.active { background: var(--bg-color); color: var(--primary); box-shadow: inset 0 2px 5px rgba(0,0,0,0.03); }

    .nav-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .nav-avatar:hover { transform: scale(1.05); }
    .nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .app-layout { display: flex; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }

    .sidebar { width: 340px; background: #ffffff; display: flex; flex-direction: column; border-radius: 28px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); z-index: 10; overflow: hidden; }
    .sidebar-form-wrapper { flex: 1; overflow-y: auto; padding: 20px 20px 0 20px; }
    .sidebar-form { background: var(--bg-color); padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.03); transition: background-color 0.6s ease; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; color: var(--primary); transition: color 0.6s; }
    .form-group input { width: 100%; padding: 12px; border: 2px solid rgba(0,0,0,0.04); border-radius: 14px; font-size: 13px; outline: none; background: #fff; transition: all 0.2s; font-weight: 600; color: var(--text); }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--bg-color); }

    .tags { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 5px; }
    .tag { padding: 8px 4px; border-radius: 12px; background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; user-select: none; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--muted); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .tag:hover { transform: translateY(-1px); }
    .tag.active { transform: translateY(-1px); font-weight: 800; background: var(--bg-color); color: var(--primary); border-color: var(--primary-light); }

    .btn-generate { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 0 var(--btn-shadow); transition: transform 0.1s, box-shadow 0.1s, background-color 0.6s; transform: translateY(0); display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-generate:active { box-shadow: 0 0px 0 var(--btn-shadow); transform: translateY(4px); }
    .btn-export { width: 100%; padding: 12px; background: #fff; color: var(--primary); border: 2px solid var(--primary); border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
    .btn-export:hover { background: var(--bg-color); }

    .sidebar-bottom { padding: 15px 20px 20px 20px; border-top: 1px dashed rgba(0,0,0,0.05); display: flex; flex-direction: column; gap: 15px; flex-shrink: 0; }
    .theme-picker { background: var(--bg-color); padding: 10px 15px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; transition: background 0.6s; }
    .theme-picker span { font-size: 13px; font-weight: 800; color: var(--primary); }
    .color-dots { display: flex; gap: 10px; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active { transform: scale(1.15); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--primary); }

    .weather-card { background: linear-gradient(135deg, var(--primary-light), var(--bg-color)); border-radius: 20px; padding: 16px 20px; display: none; border: 1px solid rgba(255,255,255,0.6); transition: background 0.6s; }
    .weather-top { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 800; color: var(--text); }
    .weather-mid { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
    .weather-mid .temp { font-size: 32px; font-weight: 800; color: var(--text); }
    .weather-bottom { display: flex; gap: 15px; font-size: 12px; font-weight: 700; color: var(--muted); }

    .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 10px; }

    .top-row { display: flex; gap: 20px; min-height: 170px; flex-shrink: 0; }
    .banner-card { flex: 2; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 28px; padding: 25px 30px; position: relative; color: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-cute); overflow: hidden; border: 2px solid #fff; transition: background 0.6s; }
    .banner-card h1 { font-size: 36px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.05); z-index: 2; position: relative;}
    .banner-emoji { position: absolute; right: 20px; bottom: -10px; font-size: 120px; opacity: 0.9; animation: float 4s ease-in-out infinite; z-index: 1;}

    .expense-card { flex: 1; background: #ffffff; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); transition: all 0.3s; }
    .expense-card.over-budget { background: #FFF0F0; border-color: #FFB8B8; animation: shake 0.5s ease-in-out; }
    .donut-chart { width: 95px; height: 95px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.05); transition: background 0.6s;}
    .donut-inner { width: 72px; height: 72px; background: #ffffff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .donut-inner strong { font-size: 16px; font-weight: 800; color: var(--primary); transition: color 0.6s; }

    .info-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; flex-shrink: 0; }
    .info-box { background: #ffffff; border-radius: 22px; padding: 20px; display: flex; gap: 15px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); transition: transform 0.2s; }
    .info-box:hover { transform: translateY(-2px); }
    .info-icon { width: 45px; height: 45px; border-radius: 14px; background: var(--bg-color); display: flex; align-items: center; justify-content: center; font-size: 22px; transition: background-color 0.6s ease; }
    .info-text span { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 700;}
    .info-text strong { font-size: 15px; font-weight: 800; color: var(--text);}

    .bottom-row { display: flex; gap: 20px; min-height: 500px; flex-shrink: 0; margin-bottom: 20px; }
    .map-widget { flex: 1.2; background: #ffffff; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .map-tools { display: flex; gap: 10px; margin-bottom: 15px; }
    .map-tools input { flex: 1; padding: 12px 18px; border-radius: 16px; border: 2px solid rgba(0,0,0,0.04); outline: none; font-size: 14px; font-weight: 600; }
    .map-tools input:focus { border-color: var(--primary); }
    .map-tools button { background: var(--primary); color: #fff; border: none; padding: 0 20px; border-radius: 16px; cursor: pointer; font-weight: 800; box-shadow: 0 4px 0 var(--btn-shadow); transition: all 0.1s, background-color 0.6s; }
    .map-tools button:active { box-shadow: 0 0 0 var(--btn-shadow); transform: translateY(4px); }
    #map-container { flex: 1; border-radius: 20px; z-index: 1; min-height: 250px; border: 1px solid rgba(0,0,0,0.05); }

    .route-config { margin-top: 15px; max-height: 120px; overflow-y: auto; padding-top: 10px; }
    .config-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; background: var(--bg-color); margin-bottom: 8px; padding: 10px 15px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.03); font-weight: 700; transition: background-color 0.6s ease;}
    .config-item select { padding: 6px 10px; border-radius: 10px; border: 2px solid rgba(0,0,0,0.05); outline: none; background: #fff; color: var(--primary); font-weight: 800; cursor: pointer; }

    .timeline-widget { flex: 1; background: #ffffff; border-radius: 28px; padding: 25px; display: flex; flex-direction: column; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .timeline-list { flex: 1; overflow-y: auto; padding-left: 15px; border-left: 3px dotted rgba(0,0,0,0.05); }
    .timeline-item { position: relative; padding-left: 25px; margin-bottom: 20px; }
    .timeline-item::before { content: '🌸'; position: absolute; left: -15px; top: 2px; font-size: 20px; background: #fff; border-radius: 50%; line-height: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    .timeline-item .day { font-size: 14px; font-weight: 800; color: var(--primary); margin-bottom: 5px; transition: color 0.6s; }
    .timeline-item .desc { font-size: 14px; color: var(--text); background: var(--bg-color); padding: 14px; border-radius: 16px; line-height: 1.6; font-weight: 600; transition: background-color 0.6s ease;}

    .view-panel { display: none; height: 100%; }
    .view-panel.active { display: block; }
    #view-diary.view-panel.active, #view-discover.view-panel.active, #view-budget.view-panel.active, #view-checklist.view-panel.active, #view-profile.view-panel.active, #view-plans.view-panel.active { display: flex; flex-direction: column; height: 100%; }

    .discover-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .discover-title { font-size: 26px; font-weight: 800; color: var(--primary); transition: color 0.6s; }
    .discover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .inspire-card { background: #ffffff; border-radius: 24px; padding: 25px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .inspire-card h3 { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; transition: color 0.6s;}
    .inspire-item { background: var(--bg-color); border-radius: 16px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--primary-light); transition: background-color 0.6s ease;}
    .inspire-item:last-child { margin-bottom: 0; }
    .inspire-item strong { display: block; font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .inspire-item p { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.5; }

    .checklist-layout { display: flex; gap: 20px; height: 100%; overflow: hidden; }
    .checklist-left { flex: 1.5; display: flex; flex-direction: column; background: #ffffff; border-radius: 28px; padding: 25px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); overflow: hidden; }
    .checklist-right { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 10px;}
    .checklist-progress { background: var(--bg-color); border-radius: 16px; padding: 15px 20px; margin-bottom: 20px; border: 2px dashed rgba(0,0,0,0.04); }
    .progress-bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.05); border-radius: 10px; margin-top: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 10px; transition: width 0.3s ease, background-color 0.6s; }
    .add-item-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .add-item-row input { flex: 1; padding: 14px 20px; border-radius: 16px; border: 2px solid rgba(0,0,0,0.04); font-weight: 600; outline: none; font-size: 14px; }
    .add-item-row input:focus { border-color: var(--primary); }
    .checklist-items { flex: 1; overflow-y: auto; padding-right: 10px; }
    .check-item { display: flex; align-items: center; padding: 15px; background: var(--bg-color); border-radius: 14px; margin-bottom: 10px; border: 2px solid transparent; transition: all 0.2s; cursor: pointer; user-select: none; }
    .check-item:hover { border-color: var(--primary-light); }
    .check-item.done { opacity: 0.5; background: #f0f0f0; text-decoration: line-through; }
    .custom-checkbox { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--primary-light); margin-right: 15px; display: flex; align-items: center; justify-content: center; background: #fff; font-size: 14px; color: #fff; transition: all 0.2s; }
    .check-item.done .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .custom-checkbox::after { content: '✔'; display: none; }
    .check-item.done .custom-checkbox::after { display: block; }
    .check-item span { font-weight: 700; font-size: 15px; color: var(--text); flex: 1; }
    .del-item { color: var(--danger); font-size: 12px; font-weight: 800; padding: 5px; opacity: 0; transition: opacity 0.2s; }
    .check-item:hover .del-item { opacity: 1; }
    .ai-recommend-card { background: #ffffff; border-radius: 24px; padding: 25px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .ai-recommend-card h3 { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .recommend-tag { display: inline-flex; justify-content: space-between; align-items: center; background: var(--bg-color); border-radius: 12px; padding: 8px 12px; margin: 0 8px 8px 0; font-weight: 700; font-size: 14px; border: 1px solid rgba(0,0,0,0.03); }
    .recommend-tag button { background: var(--primary); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; margin-left: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: transform 0.1s; }
    .clothing-tip { background: linear-gradient(135deg, #FFFBF0, #FDF2EE); border-radius: 16px; padding: 15px; color: #C28B79; font-weight: 700; font-size: 14px; line-height: 1.6; }

    .budget-layout { display: flex; gap: 20px; height: 100%; overflow: hidden; }
    .budget-left { flex: 1.5; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 10px;}
    .budget-right { flex: 1; background: #ffffff; border-radius: 28px; padding: 25px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); overflow-y: auto;}
    .warning-banner { display: none; background: #FFF0F0; border: 2px dashed #FFB8B8; color: #D63031; padding: 15px; border-radius: 16px; text-align: center; font-weight: 800; font-size: 16px; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    .warning-banner.active { display: block; }
    .add-expense-card { background: #ffffff; padding: 25px; border-radius: 28px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .add-expense-card input, .add-expense-card select { padding:14px; border-radius:16px; border:2px solid rgba(0,0,0,0.04); font-weight:600; outline:none; margin-bottom: 10px; }
    .add-expense-card input:focus, .add-expense-card select:focus { border-color: var(--primary); }
    .member-tag { display: inline-flex; align-items: center; background: var(--bg-color); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; margin-right: 8px; margin-bottom: 8px; border: 2px solid rgba(0,0,0,0.03); transition: background-color 0.6s ease;}
    .member-tag span { cursor: pointer; color: var(--danger); margin-left: 6px; font-weight: 900;}
    .settlement-card { background: var(--bg-color); border-radius: 16px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--primary); transition: background-color 0.6s ease;}
    .settlement-card strong { font-size: 15px; color: var(--primary); transition: color 0.6s;}
    .settlement-card p { font-size: 14px; font-weight: 700; margin-top: 5px; color: var(--text);}

    .diary-container { display: flex; gap: 20px; height: 100%; }
    .diary-form { width: 320px; background: #ffffff; padding: 25px; border-radius: 28px; height: fit-content; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); flex-shrink: 0;}
    .diary-form textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid rgba(0,0,0,0.04); border-radius: 16px; resize: none; margin-bottom: 15px; font-size: 14px; font-weight: 600; outline: none; }
    .diary-form textarea:focus { border-color: var(--primary); }
    .diary-list-wrapper { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding-right: 10px; }
    .diary-card { background: #ffffff; border-radius: 24px; padding: 20px; box-shadow: var(--shadow-cute); display: flex; gap: 20px; border: 1px solid rgba(255,255,255,0.8);}
    .diary-card img { width: 150px; height: 150px; object-fit: cover; border-radius: 16px; }
    .diary-card-info .del-btn { color: var(--danger); font-size: 13px; font-weight: 800; cursor: pointer; text-align: right; margin-top: 10px; }

    .profile-container { max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    .profile-header-card { background: #ffffff; border-radius: 28px; padding: 40px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); display: flex; align-items: center; gap: 30px; position: relative; overflow: hidden; }
    .profile-header-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 80px; background: linear-gradient(135deg, var(--primary-light), var(--bg-color)); z-index: 0; }

    .avatar-upload-wrapper { position: relative; z-index: 1; cursor: pointer; }
    .profile-avatar { width: 120px; height: 120px; border-radius: 50%; background: #fff; border: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 40px; color: var(--primary-light); transition: transform 0.2s; }
    .avatar-upload-wrapper:hover .profile-avatar { transform: scale(1.05); }
    .avatar-upload-wrapper input[type="file"] { display: none; }
    .avatar-edit-badge { position: absolute; bottom: 5px; right: 5px; background: var(--primary); color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    .profile-info { z-index: 1; flex: 1; margin-top: 30px; }
    .profile-name-input { font-size: 28px; font-weight: 800; color: var(--text); border: none; outline: none; background: transparent; border-bottom: 2px dashed transparent; width: 100%; margin-bottom: 10px; transition: border-color 0.2s; }
    .profile-name-input:focus { border-bottom-color: var(--primary); }
    .btn-save-profile { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--btn-shadow); transition: all 0.1s; margin-top: 15px; display: inline-block; }
    .btn-save-profile:active { box-shadow: 0 0 0 var(--btn-shadow); transform: translateY(4px); }

    .profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .stat-box { background: #ffffff; border-radius: 20px; padding: 25px 20px; text-align: center; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
    .stat-box .num { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 5px; transition: color 0.6s; }
    .stat-box .label { font-size: 13px; color: var(--muted); font-weight: 700; }

    .profile-settings { background: #ffffff; border-radius: 28px; padding: 30px; box-shadow: var(--shadow-cute); border: 1px solid rgba(255,255,255,0.8); }
